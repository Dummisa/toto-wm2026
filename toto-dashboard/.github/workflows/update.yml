name: Update Dashboard

# Aktualisiert das Dashboard automatisch bei jedem Push der Excel-Datei
# und optional stuendlich (cron). Schreibt docs/index.html zurueck ins Repo.

on:
  push:
    paths:
      - 'data/**'
      - 'src/**'
  workflow_dispatch:        # manuell ausloesbar im Actions-Tab
  # schedule:
  #   - cron: '0 * * * *'   # auskommentiert: stuendlich aktualisieren

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        run: python run.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Auto-update dashboard"
          git push
